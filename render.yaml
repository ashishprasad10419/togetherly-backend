services:
  - type: web
    name: togetherly-backend
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: "*"
      - key: JWT_ACCESS_EXPIRES
        value: 15m
      - key: JWT_REFRESH_EXPIRES
        value: 30d
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: OTP_TTL_SECONDS
        value: "300"
      # MONGO_URI must be set in Render dashboard before deploy.
      - key: MONGO_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # Cloudinary is optional — backend boots without it, only media uploads
      # fail. Add these via the Render dashboard later if you need photo/video sending.
